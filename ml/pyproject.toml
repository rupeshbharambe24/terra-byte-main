[project]
name = "terrabyte-ml"
version = "0.1.0"
description = "Training and evaluation code for TerraByte's crop disease model (not used at serving time)"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "imagehash>=4.3",
    "numpy>=2.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "pillow>=11.0",
    "requests>=2.32",
    "timm>=1.0.12",
    "torch>=2.5",
    "torchvision>=0.20",
]

[project.scripts]
tbml = "terrabyte_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrabyte_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.6"]

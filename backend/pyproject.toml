[project]
name = "terrabyte"
version = "0.1.0"
description = "TerraByte agriculture platform API (FastAPI + SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.4",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
terrabyte-api = "terrabyte.main:run"
terrabyte-seed = "terrabyte.seed:main"
terrabyte-admin = "terrabyte.cli:main"
terrabyte-import-kvk = "terrabyte.kvk_import:main"
terrabyte-import-legacy-prices = "terrabyte.prices.legacy_import:main"
terrabyte-ingest-prices = "terrabyte.prices.ingest:main"
terrabyte-backtest-prices = "terrabyte.prices.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrabyte"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"terrabyte/seed.py" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
